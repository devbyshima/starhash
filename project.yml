name: StarHash
options:
  bundleIdPrefix: com.devbyshima
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # English, French and Kinyarwanda (Localizable.xcstrings in the app, the
  # widgets and StarHashKit), chosen in StarHash's own Settings.
  knownRegions: [en, fr, rw, Base]
  # StarHashKit, a Swift package, builds an arm64e slice only when the
  # project's workspace settings say so, and the generated .xcodeproj is
  # not committed: without this the app's arm64e slice (Enhanced Security,
  # below) would link a package without pointer authentication.
  postGenCommand: >-
    mkdir -p StarHash.xcodeproj/project.xcworkspace/xcshareddata &&
    plutil -create xml1 StarHash.xcodeproj/project.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings &&
    plutil -insert iOSPackagesShouldBuildARM64e -bool YES StarHash.xcodeproj/project.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings

# Two builds (RELEASING.md): Debug, the dev build run from Xcode, and
# Release, the build that goes to TestFlight and the App Store.
configs:
  Debug: debug
  Release: release

packages:
  StarHashKit:
    path: Packages/StarHashKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    # The build number counts App Store uploads, not builds: raise it by
    # one before archiving each upload. Settings shows it after the version.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W46T258AXM
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Enhanced Security: pointer authentication (an arm64e slice beside
    # arm64 on device; the simulator keeps arm64 alone) and the compiler's
    # hardening. Its runtime half is the hardened-process entitlements in
    # StarHash.entitlements (StarHashPush.entitlements with push), signed
    # only with STARHASH_APP_GROUPS: YES (below). The protections apply from iOS 26; older iOS runs arm64.
    ENABLE_ENHANCED_SECURITY: YES
    # With the package built for arm64e (postGenCommand), Xcode builds it
    # for the Apple silicon simulator alone, so the app and widgets drop
    # the Intel simulator slice too or they can't import it.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # The widgets read the app's data through an App Group, and Enhanced
    # Security's runtime half is the hardened-process entitlements: only a
    # paid Apple Developer Program team can sign either, and a free
    # personal team's build fails with them. NO leaves both out (the
    # widgets then show Buy's default codes and no spending, and the app
    # has pointer authentication alone); YES signs the app with both and
    # the widgets with the group.
    STARHASH_APP_GROUPS: NO
    STARHASH_APP_GROUP: group.com.devbyshima.starhash
    # Push notifications for requests from anywhere (the server's APNs
    # pushes, docs/nearby-and-requests.md), which only a paid team can sign
    # too. NO leaves the aps-environment entitlement out and the app never
    # registers for remote notifications: requests come when StarHash opens
    # and through Background App Refresh. YES signs the app with it, adds
    # the remote-notification background mode, and the app sends its token
    # to the server while the owner takes requests (`ServerSync`).
    STARHASH_PUSH: NO
    # The app's entitlements, one file for each way the two switches can
    # stand.
    STARHASH_APP_ENTITLEMENTS_YES_PUSH_NO: StarHash/App/StarHash.entitlements
    STARHASH_APP_ENTITLEMENTS_YES_PUSH_YES: StarHash/App/StarHashPush.entitlements
    STARHASH_APP_ENTITLEMENTS_NO_PUSH_YES: StarHash/App/PushOnly.entitlements
    STARHASH_APP_ENTITLEMENTS_NO_PUSH_NO: ""
    # The background mode push adds. Without push it names Background App
    # Refresh's again, so the list holds fetch alone as before.
    STARHASH_PUSH_BACKGROUND_MODE_YES: remote-notification
    STARHASH_PUSH_BACKGROUND_MODE_NO: fetch
    STARHASH_WIDGET_ENTITLEMENTS_YES: StarHashWidgets/StarHashWidgets.entitlements
    STARHASH_WIDGET_ENTITLEMENTS_NO: ""
    # The id both Info.plists carry (StarHashAppGroup), empty without the
    # group so the app and the widgets see none: with the id but no
    # entitlement, each wrote and read a store of its own, and the app
    # reloaded every widget for nothing each time it left the screen.
    STARHASH_APP_GROUP_ID_YES: $(STARHASH_APP_GROUP)
    STARHASH_APP_GROUP_ID_NO: ""
  # The channel the app reads from Info.plist (`ReleaseChannel.current`),
  # which decides where each feature flag starts.
  configs:
    Debug:
      STARHASH_CHANNEL: dev
    Release:
      STARHASH_CHANNEL: production

schemes:
  # Dev runs (Debug), and the archive for TestFlight and the App Store
  # (Release).
  StarHash:
    build:
      targets:
        StarHash: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  StarHash:
    type: application
    platform: iOS
    sources:
      - path: StarHash
      # The Buy widget's view, for the widget gallery in Debug builds
      # (-widgetGallery); each file is empty outside DEBUG, except
      # WidgetIntents.swift: the widgets' taps run their intents in the
      # app, so it needs them in every build.
      - path: StarHashWidgets/Views
    dependencies:
      - package: StarHashKit
      - target: StarHashWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devbyshima.starhash
        CODE_SIGN_ENTITLEMENTS: $(STARHASH_APP_ENTITLEMENTS_$(STARHASH_APP_GROUPS)_PUSH_$(STARHASH_PUSH))
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        # One binary in Debug too. With the debug dylib, a device build's
        # App Intents step finds no AppIntents.framework in the stub it
        # reads and writes no Metadata.appintents, so Shortcuts cannot find
        # Process Carrier SMS and auto-verify's shortcut fails.
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: StarHash/App/Info.plist
      properties:
        CFBundleDisplayName: StarHash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr, rw]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Not a game: says so, as iOS now asks every app that draws with
        # Metal (the QR tree's SceneKit view), so Game Mode leaves it be.
        LSSupportsGameMode: false
        StarHashChannel: $(STARHASH_CHANNEL)
        StarHashAppGroup: $(STARHASH_APP_GROUP_ID_$(STARHASH_APP_GROUPS))
        # Whether this build has push (`StarHashPush.isOn`).
        StarHashPush: $(STARHASH_PUSH)
        UIAppFonts: [SpaceGrotesk.ttf]
        NSContactsUsageDescription: StarHash shows your contacts so you can pick who to pay. They stay on your iPhone.
        NSLocationWhenInUseUsageDescription: StarHash notes where you pay, to suggest who you paid when you are back there and to show each payment on a map. It stays on your iPhone.
        NSCameraUsageDescription: StarHash uses the camera to scan a QR code, to see who to pay, and to take your profile photo when you ask. Nothing else is recorded or kept.
        NSFaceIDUsageDescription: StarHash asks for Face ID to open, when you turn it on in Settings, so only you see your payments.
        # People Nearby: phones with StarHash open find each other over
        # Bluetooth and Wi-Fi (MultipeerConnectivity, `PeopleNearby.serviceType`).
        NSLocalNetworkUsageDescription: StarHash finds StarHash users near you so you can pay them with a tap, and lets them find you when you allow it in Settings.
        NSBonjourServices: [_starhash-near._tcp, _starhash-near._udp]
        LSApplicationQueriesSchemes: [tel]
        # Requests through the server are fetched in the background now and
        # then (`AnywhereRequests.refresh`): Background App Refresh, which
        # needs no entitlement, so free-team builds keep signing.
        UIBackgroundModes: [fetch, $(STARHASH_PUSH_BACKGROUND_MODE_$(STARHASH_PUSH))]
        BGTaskSchedulerPermittedIdentifiers: [com.devbyshima.starhash.requests]
        CFBundleURLTypes:
          - CFBundleURLName: com.devbyshima.starhash
            CFBundleURLSchemes: [starhash]

  # Buy's codes on the Home Screen, and Scan to Pay in Control Center.
  # Shares the app's colours (Theme.swift), icons (Icons.swift and
  # Icons.xcassets) and typeface.
  StarHashWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StarHashWidgets
      - path: StarHash/Design/Theme.swift
      - path: StarHash/Design/Icons.swift
      - path: StarHash/Features/Onboarding/StarHashMark.swift
      - path: StarHash/Resources/Icons.xcassets
      - path: StarHash/Resources/Fonts/SpaceGrotesk.ttf
        buildPhase: resources
      # The font's licence travels with it, as the OFL asks.
      - path: StarHash/Resources/Fonts/OFL.txt
        buildPhase: resources
      # So does the icons' MIT notice.
      - path: StarHash/Resources/KeylineIcons.txt
        buildPhase: resources
    dependencies:
      - package: StarHashKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devbyshima.starhash.widgets
        # The views in Views/ compile here always, and into the app only
        # for Debug's widget gallery.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        CODE_SIGN_ENTITLEMENTS: $(STARHASH_WIDGET_ENTITLEMENTS_$(STARHASH_APP_GROUPS))
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: StarHashWidgets/Info.plist
      properties:
        CFBundleDisplayName: StarHash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [SpaceGrotesk.ttf]
        StarHashAppGroup: $(STARHASH_APP_GROUP_ID_$(STARHASH_APP_GROUPS))

name: StarHash
options:
  bundleIdPrefix: com.fulltimestudio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

# One configuration per release channel (RELEASING.md). Beta is Release
# with its own channel, archived from a release branch for TestFlight.
configs:
  Debug: debug
  Beta: release
  Release: release

packages:
  StarHashKit:
    path: Packages/StarHashKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    # The build number counts App Store uploads, not builds: raise it by
    # one before archiving each upload. Settings shows it after the version.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7WHQR6L96K
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
  # The channel the app reads from Info.plist (`ReleaseChannel.current`),
  # which decides where each feature flag starts.
  configs:
    Debug:
      STARHASH_CHANNEL: dev
    Beta:
      STARHASH_CHANNEL: beta
    Release:
      STARHASH_CHANNEL: production

schemes:
  # Dev runs and the App Store archive (production channel).
  StarHash:
    build:
      targets:
        StarHash: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # TestFlight betas from a release branch (beta channel).
  StarHash Beta:
    build:
      targets:
        StarHash: all
    run:
      config: Beta
    test:
      config: Beta
    profile:
      config: Beta
    analyze:
      config: Beta
    archive:
      config: Beta

targets:
  StarHash:
    type: application
    platform: iOS
    sources:
      - path: StarHash
    dependencies:
      - package: StarHashKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.starhash
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: StarHash/App/Info.plist
      properties:
        CFBundleDisplayName: StarHash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        StarHashChannel: $(STARHASH_CHANNEL)
        UIAppFonts: [SpaceGrotesk.ttf]
        NSContactsUsageDescription: StarHash shows your contacts so you can pick who to pay. They stay on your iPhone.
        NSLocationWhenInUseUsageDescription: StarHash notes where you pay, to suggest who you paid when you are back there and to show each payment on a map. It stays on your iPhone.
        NSFaceIDUsageDescription: StarHash asks for Face ID to open, when you turn it on in Settings, so only you see your payments.
        LSApplicationQueriesSchemes: [tel]
        CFBundleURLTypes:
          - CFBundleURLName: com.fulltimestudio.starhash
            CFBundleURLSchemes: [starhash]
